<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
            <link rel="icon" type="image/jpeg" href="../ico/Wingmate.ico" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS for theme colors -->
    <style>
        body {
            /* Using a combination of the teal and grey for a gradient background */
            background: linear-gradient(135deg, #e0e0e0 0%, #1b8592 100%);
            scrollbar-width: thick;
            scrollbar-color: #1b8492c7 #f8f9fa;
        }

        .password-card-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .password-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
        }

        .btn-password-reset {
            background-color: #1b8592;
            color: white !important;
            font-weight: bold;
            padding: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-password-reset:hover {
            background-color: #1a7480;
            color: white;
            cursor: pointer;
        }

        .form-control:focus {
            border-color: #1b859259;
            box-shadow: 0 0 0 0.25rem #1b859259;
            outline: 0;
        }

        /* Bubble pattern background */
        .bubble-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(27, 133, 146, 0.4) 10%, transparent 11%),
                radial-gradient(circle at 85% 20%, rgba(136, 136, 136, 0.4) 10%, transparent 11%),
                radial-gradient(circle at 40% 90%, rgba(27, 133, 146, 0.3) 10%, transparent 11%),
                radial-gradient(circle at 70% 60%, rgba(136, 136, 136, 0.3) 10%, transparent 11%),
                radial-gradient(circle at 25% 30%, rgba(27, 133, 146, 0.2) 10%, transparent 11%),
                radial-gradient(circle at 60% 80%, rgba(136, 136, 136, 0.2) 10%, transparent 11%);
            background-size: 200px 200px;
            z-index: -1;
        }

        /* Webkit browsers (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 15px;
        }

        ::-webkit-scrollbar-track {
            background: #f8f9fa;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #1b8492c7;
            border-radius: 10px;
            border: 2px solid #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="bubble-pattern"></div>

    <div class="password-card-container">
        <div class="card p-4 shadow-lg rounded-4 password-card" style="max-width: 500px; width: 100%;">
            <div class="card-body">
                <!-- Logo placeholder -->
                <div class="text-center mb-4">
                    <img src="../ico/Wingmate_transparent.png" alt="Logo" width="130" height="130" class="rounded-circle">
                </div>

                <!-- Forgot Password heading -->
                <h3 class="text-center mb-4" style="color: #1b8592;">Forgot Password?</h3>

                <form>
                    <!-- Instructions -->
                    <div class="mb-3 text-center text-secondary">
                        <p>Enter your Username to receive a password reset link.</p>
                    </div>

                    <!-- Email form group -->
                    <div class="mb-4">
                        <label for="username" class="form-label text-secondary">Username</label>
                        <input type="text" class="form-control rounded-2" id="usernameinput" placeholder="Enter Username">
                    </div>

                    <!-- Send Reset Link button -->
                    <div class="d-grid">
                        <a href="./login.html" type="submit" class="btn btn-password-reset rounded-2">Send Reset Link</a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="./login.html" class="text-decoration-none fw-bold" style="color: #1b8592;">Return to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
