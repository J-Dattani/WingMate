<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resident Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="../ico/Wingmate.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary-color: #116196;
            --secondary-color: #436791;
            --light-bg-color: #f8fafc;
            --card-bg-color: #fff;
            --text-color: #1f2937;
            --muted-text-color: #6b7280;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg-color);
            color: var(--text-color);
        }
        .card {
            background-color: var(--card-bg-color);
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            padding: 2rem;
            margin-top: 2rem;
        }
        .form-label {
            font-weight: 500;
            color: var(--primary-color);
        }
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex align-items-center my-4">
            <h1 class="fw-bold m-0" style="color: #1b8592;">Edit Resident Details</h1>
        </div>
        <div class="card">
            <form>
                <div class="mb-3">
                    <label for="ownerName" class="form-label">Owner Name</label>
                    <input type="text" class="form-control" id="ownerName" placeholder="Enter Owner Name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter Email Address" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Enter Phone Number" pattern="[0-9]{10}" required>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-4">
                        <label for="wing" class="form-label">Wing</label>
                        <input type="text" class="form-control" id="wing" placeholder="Enter Wing" required>
                    </div>
                    <div class="mb-3 col-md-4">
                        <label for="floor" class="form-label">Floor</label>
                        <input type="text" class="form-control" id="floor" placeholder="Enter Floor" required>
                    </div>
                    <div class="mb-3 col-md-4">
                        <label for="block" class="form-label">Block</label>
                        <input type="text" class="form-control" id="block" placeholder="Enter Block" required>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a style="background-color: #1b8592;" type="submit" class="btn btn-primary">Save Changes</a>
                    <a href="./residents.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./js/edit-resident.js"></script>
</body>
</html>
