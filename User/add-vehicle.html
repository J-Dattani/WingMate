<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingmate - Add Vehicle Request</title>
    <link rel="icon" type="image/jpeg" href="../ico/Wingmate.ico" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
          body{
        
          scrollbar-width:thick;
            scrollbar-color: #1b8492c7 #f8f9fa;
      }


     /* Webkit browsers (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 15px;
        }

        ::-webkit-scrollbar-track {
            background: #f8f9fa;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #1b8492c7;
            border-radius: 10px;
            border: 2px solid #f8f9fa;
        }
        .radial-pattern {
            position: absolute;
            right: 0;
            top: 0;
            width: 450px;
            height: 450px;
            background-color: transparent;
            background-image: radial-gradient(
                circle at 100% 0,
                #1b849261 10%,
                #3736ab00 11%,
                transparent 20%,
                rgb(195 224 202 / 0%) 21%
            ),
            radial-gradient(
                circle at 100% 0,
                #1b849234 30%,
                #78c68a1b 31%,
                transparent 40%,
                rgb(195 224 202 / 0%) 41%
            ),
            radial-gradient(
                circle at 100% 0,
                #1b849214 50%,
                transparent 51%,
                #3d121200 60%,
                rgb(255 255 255 / 0%) 61%
            );
        }


        .nav-link {
            color: #1b8492c7;
            font-weight: bold;
        }

        .nav-link.active {
            color: #1b8492e5;
            text-decoration: underline;
        }

        /* Custom form styling for a modern look */
        .form-control, .form-select, .btn-primary, .btn-secondary {
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-color: #1b8492c7;
            outline: none;
        }

        .btn-primary, .btn-secondary {
            background-color: #1b8492c7;
            border: none;
            font-weight: bold;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            background-color: #1b8492e5;
        }
    </style>
</head>
<body>
    <div class="radial-pattern"></div>

    <div class="container-fluid p-0">
       <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container-fluid">
        <!-- Brand / Logo -->
        <a class="navbar-brand d-flex align-items-center" href="#">
          <!-- Increased logo size -->
          <img
            src="../ico/Wingmate_transparent.png"
            alt="Logo"
            width="100"
            height="100"
          />
        </a>

     
      </div>
    </nav>

        <!-- Main Content Section -->
        <main class="d-flex flex-column align-items-center justify-content-center p-4">
            <h1 class="text-center mb-5" style="color: #1b8492c7;">Add New Vehicle Request</h1>

            <div class="card p-4 rounded-4 shadow-lg" style="max-width: 600px; width: 100%;">
                <form>
                    <div class="mb-3">
                        <label for="ownerName" class="form-label">Owner Name</label>
                        <input type="text" class="form-control" id="ownerName" value="Nick" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="wing" class="form-label">Wing</label>
                        <input type="text" class="form-control" id="wing" value="A" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="flatNo" class="form-label">Flat No</label>
                        <input type="text" class="form-control" id="flatNo" value="1001" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="vehicleNumber" class="form-label">Vehicle Number</label>
                        <input type="text" class="form-control" id="vehicleNumber" placeholder="e.g., GJ05 1234">
                    </div>
                    <div class="mb-3">
                        <label for="vehicleType" class="form-label">Vehicle Type</label>
                        <select class="form-select" id="vehicleType" aria-label="Vehicle type selection">
                            <option selected>Select Type</option>
                            <option value="2-wheeler">2 Wheeler</option>
                            <option value="4-wheeler">4 Wheeler</option>
                            
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="modelName" class="form-label">Model Name</label>
                        <input type="text" class="form-control" id="modelName" placeholder="e.g., Swift">
                    </div>
                  
                    <a href="./vehicle-entry.html" type="submit" class="btn btn-primary" style="background-color: #1b8492c7; border: none; font-weight: bold;">Add Request</a>
                     <a href="./vehicle-entry.html" type="button" class="btn btn-secondary" style="background-color: #1b8492c7; border: none; font-weight: bold;">Discard</a>
                </form>
            </div>
        </main>
       
    
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
