<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="../ico/Wingmate.ico" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Wingmate - Raise Complaint</title>
    <style>
          body{
        
          scrollbar-width:thick;
            scrollbar-color: #1b8492c7 #f8f9fa;
      }


     /* Webkit browsers (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 15px;
        }

        ::-webkit-scrollbar-track {
            background: #f8f9fa;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #1b8492c7;
            border-radius: 10px;
            border: 2px solid #f8f9fa;
        }
      .navbar .nav-link {
        color: #000 !important;
        text-decoration: none;
        padding: 6px 16px;
        transition: all 0.5s ease-in-out;
      }

      /* Hover + Active = pill */
      .navbar .nav-link:hover,
      .navbar .nav-link.active {
        background-color: #1b8592;
        color: #fff !important;
        border-radius: 50px;
      }

      .site-footer {
        background-color: #f8f9fa;
        color: #333;
        font-family: Arial, sans-serif;
        border-top: 1px solid #ddd;
      }

      .footer-section h4 {
        color: #1b8592;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .footer-section p,
      .footer-section ul li {
        font-size: 0.95rem;
        color: #555;
      }

      .footer-section ul {
        padding-left: 0;
      }

      .footer-section ul li a {
        color: #555;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .footer-section ul li a:hover {
        color: #1b8592;
      }

      .contact-info li {
        margin-bottom: 10px;
      }

      .contact-info li i {
        margin-right: 10px;
        color: #1b8592;
      }

      .social-icons .social-link {
        color: #555;
        font-size: 1.5rem;
        margin-right: 15px;
        transition: color 0.3s ease;
      }

      .social-icons .social-link:hover {
        color: #1b8592;
      }

      .footer-bottom {
        border-top: 1px solid #ddd;
        color: #777;
      }

      .radial-pattern {
        position: absolute;
        right: 0;
        top: 0;
        width: 450px;
        height: 450px;
        background-color: transparent;
        background-image: radial-gradient(
            circle at 100% 0,
            #1b849238 10%,
            #3736ab00 11%,
            transparent 20%,
            rgb(195 224 202 / 0%) 21%
          ),
          radial-gradient(
            circle at 100% 0,
            #1b84921c 30%,
            #78c68a00 31%,
            transparent 40%,
            rgb(195 224 202 / 0%) 41%
          ),
          radial-gradient(
            circle at 100% 0,
            #1b84920b 50%,
            transparent 51%,
            #3d121200 60%,
            rgb(255 255 255 / 0%) 61%
          );
      }

       /* Custom form styling for a modern look */
        .form-control, .form-select, .btn-primary, .btn-secondary {
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-color: #1b8492c7;
            outline: none;
        }

        .btn-primary {
            background-color: #1b8492c7;
            border: none;
            font-weight: bold;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            background-color: #1b8492e5;
        }
      /* Responsive adjustments for smaller screens */
      @media (max-width: 768px) {
        .footer-section {
          text-align: center;
          margin-bottom: 30px;
        }
        .footer-section ul {
          display: inline-block;
          padding: 0;
        }
      }
      /* --- Mobile Fixes --- */
      @media (max-width: 768px) {
        .navbar-nav .nav-link {
          padding-top: 15px;
          padding-bottom: 15px;
        }

        .radial-pattern {
          width: 80vw;
          height: 80vw;
          z-index: -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="radial-pattern"></div>
    <div class="radial-pattern"></div>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container-fluid">
        <!-- Brand / Logo -->
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <!-- Increased logo size -->
          <img
            src="../ico/Wingmate_transparent.png"
            alt="Logo"
            width="100"
            height="100"
          />
        </a>     
      </div>
    </nav>

        <!-- Main Content Section -->
        <main class="d-flex flex-column align-items-center justify-content-center p-4">
            <h1 class="text-center mb-5" style="color: #1b8492c7;">Raise a Complaint</h1>

            <div class="card p-4 rounded-4 shadow-lg" style="max-width: 600px; width: 100%;">
                <form>
                    <div class="mb-3">
                        <label for="ownerName" class="form-label">Owner Name</label>
                        <input type="text" class="form-control" id="ownerName" value="Nick" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="wing" class="form-label">Wing</label>
                        <input type="text" class="form-control" id="wing" value="A" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="floorNo" class="form-label">Floor No</label>
                        <input type="text" class="form-control" id="floorNo" value="10" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="flatNo" class="form-label">Flat No</label>
                        <input type="text" class="form-control" id="flatNo" value="1001" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" aria-label="Complaint category selection">
                            <option selected>Select Category</option>
                            <option value="gas-line">Gas Line</option>
                            <option value="water-line">Water Line</option>
                            <option value="floor-lamp">Floor Lamp</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                  
                    <div class="mb-3">
                        <label for="message" class="form-label">Your Message</label>
                        <textarea class="form-control" id="message" rows="5"></textarea>
                    </div>
                    <a href="../index.html" type="submit" class="btn btn-primary" style="background-color: #1b8492c7; border: none; font-weight: bold;">Raise Complaint</a>
                     <a href="../index.html" type="button" class="btn btn-secondary" style="background-color: #1b8492c7; border: none; font-weight: bold;">Discard</a>
                </form>
            </div>
        </main>
          <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
